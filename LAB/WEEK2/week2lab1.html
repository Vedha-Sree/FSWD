<!DOCTYPE html>
<html>
<head>
    <title>Educational Qualifications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #5B9BD5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Educational Qualifications</h1>

    <form>

        <label>10th / SSLC:</label>
        <input type="text" placeholder="School Name">

        <label>10th Percentage:</label>
        <input type="number" placeholder="Percentage">

        <label>12th / PUC:</label>
        <input type="text" placeholder="College Name">

        <label>12th Percentage:</label>
        <input type="number" placeholder="Percentage">

        <label>Degree:</label>
        <input type="text" placeholder="Degree Name">

        <label>College:</label>
        <input type="text" placeholder="College Name">

        <label>University:</label>
        <input type="text" placeholder="University Name">

        <label>Degree Percentage / CGPA:</label>
        <input type="text" placeholder="Percentage or CGPA">

        <div class="buttons">
            <a href="personal.html">
                <button type="button">Previous</button>
            </a>

            <button type="submit">Submit</button>
        </div>

    </form>

</div>

</body>
</html>
