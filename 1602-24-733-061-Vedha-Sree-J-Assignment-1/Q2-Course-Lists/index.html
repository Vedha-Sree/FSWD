<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Lists</title>
</head>

<body>

    <h2>Categorized Course Lists</h2>

    <!-- Programming Languages -->
    <label for="language">Programming Languages:</label>

    <select id="language">
        <option value="">Select a Language</option>
        <option>C</option>
        <option>C++</option>
        <option>Java</option>
        <option>Python</option>
    </select>

    <br><br>

    <!-- Data Structures -->
    <label for="structure">Data Structures:</label>

    <select id="structure">
        <option value="">Select a Data Structure</option>
        <option>Array</option>
        <option>Linked List</option>
        <option>Stack</option>
        <option>Queue</option>
    </select>

    <br><br>

    <!-- Software Engineering Topics -->
    <label for="software">Software Engineering Topics:</label>

    <input list="softwareTopics" id="software"
           placeholder="Choose or type a topic">

    <datalist id="softwareTopics">
        <option value="SDLC">
        <option value="Agile Model">
        <option value="Waterfall Model">
        <option value="UML Diagrams">
        <option value="Testing Techniques">
    </datalist>

</body>
</html>
